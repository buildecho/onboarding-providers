name: echo-ecr-mirror-module-created-cmk
description: "Echo ECR pull-through cache example: Component-created KMS key"
runtime:
  name: nodejs
  options:
    typescript: true
config:
  echoRegistryAccountId:
    type: string
    description: Echo registry account ID (provided by Echo)
  cacheNamespace:
    type: string
    default: echo-pulumi-module-created-cmk
    description: Pull-through cache prefix; IAM role, policy and KMS alias names are derived from it
